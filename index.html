<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALLAH AI | الرد الذكي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { background: #050505; color: white; font-family: 'Cairo', sans-serif; height: 100vh; display: flex; flex-direction: column; margin: 0; }
        header { padding: 20px; border-bottom: 2px solid #d4af37; text-align: center; background: #000; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 15px; border-radius: 15px; font-size: 15px; }
        .ai { align-self: flex-start; background: #111; border-right: 4px solid #00f2ff; }
        .user { align-self: flex-end; background: #d4af37; color: black; font-weight: bold; }
        .loader { color: #d4af37; font-size: 12px; display: none; text-align: center; margin: 10px; }
        .input-area { padding: 20px; background: #000; display: flex; gap: 10px; border-top: 1px solid #222; }
        input { flex: 1; background: #111; border: 1px solid #333; padding: 15px; border-radius: 12px; color: white; outline: none; }
        button { background: #d4af37; border: none; padding: 0 25px; border-radius: 12px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0; color:#d4af37">TALLAH <span style="color:white">AI</span></h2>
</header>

<div id="chat-window">
    <div class="msg ai">أهلاً بك يا إمبراطور. أنا جاهز للرد الآن، اسألني أي شيء عن براند طلة.</div>
</div>

<div id="loader" class="loader"><i class="fas fa-spinner fa-spin"></i> جاري استدعاء الذكاء الاصطناعي...</div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="اكتب سؤالك هنا...">
    <button onclick="startThinking()">إرسال</button>
</div>

<script>
    // بياناتك المحدثة
    const API_TOKEN = "cfut_zt6wqYqCxAWReGyR0ITOdwGcU175oXdYDIoDfYiZ375adfab";
    const ACCOUNT_ID = "Vb4wU8bjlYi0iDFbnTQ4k5Ta0c8bOVUxLI3Azf2K344a167a";

    async function startThinking() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if(!text) return;

        appendMsg(text, 'user');
        input.value = '';
        document.getElementById('loader').style.display = 'block';

        // محاولة الرد
        try {
            const response = await fetch(
                `https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/ai/run/@cf/meta/llama-3-8b-instruct`,
                {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: "أنت المساعد الذكي لإمبراطورية طلة." },
                            { role: "user", content: text }
                        ]
                    })
                }
            );

            const data = await response.json();
            
            if(data.success) {
                appendMsg(data.result.response, 'ai');
            } else {
                appendMsg("يا ملك، الـ Token محتاج تفعيل خاصية الـ Workers AI من إعدادات Cloudflare Dashboard.", 'ai');
            }
        } catch (error) {
            appendMsg("خطأ في الاتصال. جرب تفتح الموقع من سيرفر (Live Server) مش كملف عادي.", 'ai');
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    }

    function appendMsg(text, type) {
        const win = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        win.appendChild(div);
        win.scrollTop = win.scrollHeight;
    }
</script>

</body>
</html>
