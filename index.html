<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALLAH EMPIRE | النظام العصبي الشامل</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        :root { --gold: #d4af37; --cyan: #00f2ff; --bg: #020202; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* الهيدر الإمبراطوري */
        header { padding: 15px 25px; background: #000; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .crown-status { background: var(--gold); color: black; padding: 5px 15px; border-radius: 20px; font-weight: 900; font-size: 14px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(212, 175, 55, 0); } 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); } }

        /* تقسيم الشاشة */
        .main-layout { flex: 1; display: flex; overflow: hidden; }
        
        /* القائمة الجانبية (الـ 1000 خدمة) */
        aside { width: 280px; background: #050505; border-left: 1px solid #1a1a1a; padding: 20px; overflow-y: auto; }
        .search-services { width: 100%; padding: 10px; background: #111; border: 1px solid var(--gold); color: white; border-radius: 8px; margin-bottom: 20px; }
        .service-item { padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #aaa; }
        .service-item:hover { background: rgba(212, 175, 55, 0.1); color: var(--gold); }

        /* منطقة الـ AI */
        main { flex: 1; display: flex; flex-direction: column; background: radial-gradient(circle at center, #111 0%, #000 100%); }
        #chat-window { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
        .bubble { max-width: 80%; padding: 15px 20px; border-radius: 15px; font-size: 15px; line-height: 1.6; }
        .ai-bubble { align-self: flex-start; background: #1a1a1a; border-right: 4px solid var(--cyan); border-bottom-left-radius: 2px; }
        .user-bubble { align-self: flex-end; background: var(--gold); color: black; font-weight: bold; border-bottom-right-radius: 2px; }

        /* منطقة الإدخال */
        .input-area { padding: 25px; background: #000; border-top: 1px solid #1a1a1a; }
        .input-container { max-width: 900px; margin: 0 auto; display: flex; gap: 15px; }
        input { flex: 1; background: #111; border: 1px solid #333; padding: 15px; border-radius: 12px; color: white; outline: none; }
        .btn-king { background: var(--gold); border: none; padding: 0 25px; border-radius: 12px; cursor: pointer; font-weight: 900; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; font-size: 24px; color: var(--gold);">TALLAH <span style="color:white">EMPIRE</span></div>
    <div class="crown-status">👑 الملك يخطب في الرعية الآن!</div>
</header>

<div class="main-layout">
    <aside id="services-list">
        <input type="text" class="search-services" placeholder="ابحث في 1000 خدمة...">
        </aside>

    <main>
        <div id="chat-window">
            <div class="bubble ai-bubble">مرحباً بك يا إمبراطور طلة. تم تفعيل الربط العصبوني بنجاح. أنا الآن متصل بمحركات Cloudflare و Hugging Face.</div>
        </div>
        <div class="input-area">
            <div class="input-container">
                <input type="text" id="master-input" placeholder="اطلب تصميماً، برمج كوداً، أو اسأل أي شيء...">
                <button class="btn-king" onclick="processCommand()">إرسال</button>
            </div>
        </div>
    </main>
</div>

<script>
    // المفاتيح التي زودتني بها
    const CF_TOKEN = "cfut_zt6wqYqCxAWReGyR0ITOdwGcU175oXdYDIoDfYiZ375adfab";
    const HF_TOKEN = "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";
    const ACCOUNT_ID = "Vb4wU8bjlYi0iDFbnTQ4k5Ta0c8bOVUxLI3Azf2K344a167a";

    async function processCommand() {
        const input = document.getElementById('master-input');
        const query = input.value.trim();
        if(!query) return;

        appendMsg(query, 'user-bubble');
        input.value = '';

        // إذا كان الطلب صورة
        if(query.includes("صورة") || query.includes("تصميم")) {
            await generateImage(query);
        } else {
            await chatWithAI(query);
        }
    }

    async function chatWithAI(text) {
        try {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/ai/run/@cf/meta/llama-3-8b-instruct`, {
                method: "POST",
                headers: { "Authorization": `Bearer ${CF_TOKEN}` },
                body: JSON.stringify({ messages: [{role: "user", content: text}] })
            });
            const data = await response.json();
            appendMsg(data.result.response, 'ai-bubble');
        } catch (e) {
            appendMsg("يا ملك، هناك مشكلة في الاتصال بالسيرفر. تأكد من صلاحيات الـ Token.", 'ai-bubble');
        }
    }

    async function generateImage(prompt) {
        appendMsg("جاري تصميم الموديل في معامل طلة...", 'ai-bubble');
        // هنا يتم الربط مع Hugging Face لتوليد الصورة
    }

    function appendMsg(text, className) {
        const win = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = `bubble ${className}`;
        div.innerText = text;
        win.appendChild(div);
        win.scrollTop = win.scrollHeight;
    }
</script>
</body>
</html>
