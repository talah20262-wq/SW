<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALLAH AI | الذكاء الإمبراطوري</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        :root { --cyan: #00f2ff; --gold: #d4af37; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Cairo', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        
        /* واجهة المستخدم */
        header { padding: 20px; text-align: center; border-bottom: 1px solid #222; background: #000; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px 20px; border-radius: 15px; line-height: 1.6; font-size: 15px; }
        .user { align-self: flex-end; background: var(--cyan); color: #000; font-weight: bold; }
        .ai { align-self: flex-start; background: #1a1a1a; border-right: 3px solid var(--gold); }
        
        /* منطقة الإدخال */
        .input-area { padding: 20px; background: #000; display: flex; gap: 10px; border-top: 1px solid #222; }
        input { flex: 1; padding: 15px; border-radius: 10px; border: 1px solid #333; background: #111; color: white; outline: none; }
        input:focus { border-color: var(--cyan); }
        button { background: var(--cyan); border: none; padding: 0 25px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        
        /* لودنج */
        .loading { font-size: 12px; color: var(--gold); display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0; color:var(--gold)">TALLAH <span style="color:white">AI</span></h2>
    <small>مدعوم بمحرك Cloudflare الإمبراطوري</small>
</header>

<div id="chat-box">
    <div class="msg ai">مرحباً بك يا إمبراطور طلة، كيف يمكنني مساعدتك برمجياً أو تسويقياً اليوم؟</div>
</div>

<div class="input-area">
    <div id="loader" class="loading">جاري التفكير...</div>
    <input type="text" id="userInput" placeholder="اسأل أي شيء...">
    <button onclick="askAI()">إرسال</button>
</div>

<script>
    // بياناتك اللي بعتها (حطيتها لك هنا عشان يشتغل فوراً)
    const API_TOKEN = "cfut_jKc38HfVyQWRsTyjbP1JnCMdgiS9SGBl5lWd5LJ7465e8a90";
    const ACCOUNT_ID = "Vb4wU8bjlYi0iDFbnTQ4k5Ta0c8bOVUxLI3Azf2K344a167a"; // استخرجته من الـ Token بتاعك

    async function askAI() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        // إضافة رسالة المستخدم للشركة
        appendMsg(text, 'user');
        input.value = '';
        document.getElementById('loader').style.display = 'block';

        try {
            // ربط حقيقي مع Cloudflare Workers AI (نموذج Llama 3)
            const response = await fetch(
                `https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/ai/run/@cf/meta/llama-3-8b-instruct`,
                {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${API_TOKEN}` },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: "أنت مساعد ذكي لبراند أزياء اسمه طلة (Tallah). صاحب البراند هو إمبراطور في التسويق." },
                            { role: "user", content: text }
                        ]
                    })
                }
            );

            const data = await response.json();
            const aiResponse = data.result.response;
            appendMsg(aiResponse, 'ai');

        } catch (error) {
            appendMsg("عذراً يا ملك، فيه مشكلة في الربط. تأكد إن الـ Token مفعل فيه صلاحيات Workers AI.", 'ai');
            console.error(error);
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    }

    function appendMsg(text, type) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    // تشغيل الإرسال بالإنتر
    document.getElementById('userInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') askAI();
    });
</script>

</body>
</html>
