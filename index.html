<!-- create.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-600 to-blue-800 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white rounded-3xl p-10 shadow-2xl w-full max-w-lg">
        <h2 class="text-3xl font-black text-center mb-2">أنشئ متجرك الآن 🚀</h2>
        <p class="text-slate-500 text-center mb-8">ابدأ في بناء إمبراطوريتك التجارية مع طلة</p>
        
        <div class="space-y-6">
            <div>
                <label class="block font-bold mb-2">اسم المتجر</label>
                <input type="text" id="sName" placeholder="مثلاً: ليالي كوين" class="w-full p-4 border-2 border-slate-100 rounded-xl focus:border-indigo-500 outline-none">
            </div>
            <div>
                <label class="block font-bold mb-2">الرابط المفضل</label>
                <div class="flex items-center border-2 border-slate-100 rounded-xl focus-within:border-indigo-500">
                    <input type="text" id="sSub" placeholder="my-store" class="w-full p-4 outline-none rounded-xl">
                    <span class="p-4 bg-slate-50 font-bold text-slate-400">.talla.com</span>
                </div>
            </div>
            <button onclick="createStore()" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black text-xl hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all">
                إنشاء المتجر وحجز الرابط ✨
            </button>
        </div>
    </div>

    <script>
        async function createStore() {
            const data = {
                storeName: document.getElementById('sName').value,
                subdomain: document.getElementById('sSub').value,
                ownerEmail: "user@example.com"
            };
            const res = await fetch('http://localhost:3000/api/stores/create', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if(result.success) {
                alert("مبروك! متجرك بقى جاهز على الرابط: " + result.url);
            } else {
                alert("الاسم ده محجوز، جرب اسم تاني يا بطل!");
            }
        }
    </script>
</body>
</html>
