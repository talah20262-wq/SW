<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALLAH AI | الإمبراطورية الشاملة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        :root { --gold: #d4af37; --cyan: #00f2ff; --bg: #050505; --card: #111; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* الهيدر الإمبراطوري */
        header { padding: 15px 25px; background: #000; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 900; font-size: 24px; color: var(--gold); letter-spacing: 1px; }
        .status-tag { background: #00ff8822; color: #00ff88; padding: 5px 12px; border-radius: 20px; font-size: 12px; border: 1px solid #00ff88; }

        /* منطقة الشات */
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: radial-gradient(circle at center, #111 0%, #000 100%); }
        .bubble { max-width: 85%; padding: 15px; border-radius: 15px; font-size: 15px; line-height: 1.6; position: relative; animation: fadeIn 0.3s ease; }
        .ai { align-self: flex-start; background: var(--card); border-right: 4px solid var(--cyan); }
        .user { align-self: flex-end; background: var(--gold); color: black; font-weight: bold; }
        
        /* مؤشر التفكير */
        #thinking { display: none; padding: 10px 20px; color: var(--cyan); font-size: 13px; font-weight: bold; }

        /* منطقة الإدخال */
        .input-area { padding: 20px; background: #000; border-top: 1px solid #222; display: flex; gap: 10px; }
        input { flex: 1; background: #111; border: 1px solid #333; padding: 15px; border-radius: 12px; color: white; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--cyan); }
        button { background: var(--gold); border: none; padding: 0 25px; border-radius: 12px; cursor: pointer; font-weight: 900; transition: 0.3s; }
        button:hover { transform: scale(1.05); filter: brightness(1.1); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header>
    <div class="logo">TALLAH <span style="color:white">AI</span></div>
    <div class="status-tag"><i class="fas fa-crown"></i> الملك يخطب في الرعية</div>
</header>

<div id="chat-window">
    <div class="bubble ai">مرحباً بك يا إمبراطور. تم تحديث النظام بالكامل. أنا الآن أسمعك وأستطيع الرد عليك باستخدام محركات Cloudflare و Hugging Face معاً.</div>
</div>

<div id="thinking"><i class="fas fa-microchip fa-spin"></i> جاري التفكير في عقل الإمبراطورية...</div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="اطلب أي شيء من الملك..." autocomplete="off">
    <button onclick="handleLogic()">إرسال</button>
</div>

<script>
    // مفاتيحك الملكية
    const config = {
        cfToken: "cfut_zt6wqYqCxAWReGyR0ITOdwGcU175oXdYDIoDfYiZ375adfab",
        cfAccount: "Vb4wU8bjlYi0iDFbnTQ4k5Ta0c8bOVUxLI3Azf2K344a167a",
        hfToken: "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"
    };

    async function handleLogic() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if(!text) return;

        appendMsg(text, 'user');
        input.value = '';
        document.getElementById('thinking').style.display = 'block';

        // محاولة الرد عبر المحرك الأول (Cloudflare)
        let success = await callCloudflare(text);
        
        // لو المحرك الأول فشل (مبيعرفش يرد)، المحرك الثاني (Hugging Face) يتدخل فوراً
        if(!success) {
            console.log("المحرك الأول لم يرد، جاري تفعيل الخطة البديلة...");
            await callHuggingFace(text);
        }

        document.getElementById('thinking').style.display = 'none';
    }

    async function callCloudflare(prompt) {
        try {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${config.cfAccount}/ai/run/@cf/meta/llama-3-8b-instruct`, {
                method: "POST",
                headers: { "Authorization": `Bearer ${config.cfToken}`, "Content-Type": "application/json" },
                body: JSON.stringify({ messages: [{ role: "system", content: "أنت مساعد براند طلة للأزياء." }, { role: "user", content: prompt }] })
            });
            const data = await response.json();
            if(data.success) {
                appendMsg(data.result.response, 'ai');
                return true;
            }
            return false;
        } catch (e) { return false; }
    }

    async function callHuggingFace(prompt) {
        try {
            const response = await fetch("https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2", {
                headers: { Authorization: `Bearer ${config.hfToken}`, "Content-Type": "application/json" },
                method: "POST",
                body: JSON.stringify({ inputs: `<s>[INST] أنت مساعد إمبراطور طلة: ${prompt} [/INST]` }),
            });
            const result = await response.json();
            const reply = result[0].generated_text.split('[/INST]')[1] || "عذراً يا ملك، السيرفرات مشغولة حالياً.";
            appendMsg(reply, 'ai');
        } catch (e) {
            appendMsg("يا ملك، فيه مشكلة في الـ API Tokens، محتاجين نتأكد من صلاحياتها في المواقع الرسمية.", 'ai');
        }
    }

    function appendMsg(t, type) {
        const win = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = `bubble ${type}`;
        div.innerText = t;
        win.appendChild(div);
        win.scrollTop = win.scrollHeight;
    }

    document.getElementById('userInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleLogic(); });
</script>
</body>
</html>
