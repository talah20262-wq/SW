<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TALLAH AI | محرك الاستجابة الفورية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { background: #020202; color: #d4af37; font-family: 'Cairo', sans-serif; text-align: center; padding: 40px; }
        .ai-terminal { background: #0a0a0a; border: 2px solid #d4af37; border-radius: 20px; max-width: 700px; margin: 0 auto; padding: 30px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.2); }
        #response-box { background: #000; padding: 20px; min-height: 120px; border-radius: 10px; border: 1px solid #222; margin: 20px 0; color: #fff; line-height: 1.8; text-align: right; }
        input { width: 80%; padding: 15px; border-radius: 12px; border: 1px solid #333; background: #111; color: white; font-size: 16px; outline: none; margin-bottom: 20px; }
        input:focus { border-color: #00f2ff; }
        .btn-king { background: #d4af37; color: #000; border: none; padding: 15px 40px; border-radius: 12px; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .btn-king:hover { transform: scale(1.05); filter: brightness(1.2); }
        .loader { color: #00f2ff; display: none; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="ai-terminal">
        <h1 style="margin-bottom: 10px;">إمبراطورية طلة <span style="color:white">AI</span></h1>
        <p style="color:#666; font-size: 14px; margin-bottom: 30px;">نظام الاستجابة العصبية الفورية v5.0</p>

        <div id="loader" class="loader">جاري استحضار الحكمة الإمبراطورية...</div>
        <div id="response-box">أنا أسمعك يا ملك، ما هو أمرك اليوم؟</div>

        <input type="text" id="userQuery" placeholder="اسأل أي شيء لبراند طلة...">
        <br>
        <button class="btn-king" onclick="callTallahAI()">إصدار الأمر</button>
    </div>

    <script>
        // مفتاحك الجديد الذي أرسلته
        const HF_KEY = "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";

        async function callTallahAI() {
            const box = document.getElementById('response-box');
            const input = document.getElementById('userQuery');
            const loader = document.getElementById('loader');
            const text = input.value.trim();

            if (!text) return;

            box.innerText = "";
            loader.style.display = "block";

            try {
                // استخدام نموذج Mistral القوي والسريع
                const response = await fetch(
                    "https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2",
                    {
                        headers: { 
                            "Authorization": `Bearer ${HF_KEY}`,
                            "Content-Type": "application/json"
                        },
                        method: "POST",
                        body: JSON.stringify({ 
                            inputs: `أجب كأنك مساعد ذكي لبراند أزياء عالمي اسمه طلة، كن مختصراً ولبقاً وقوياً: ${text}`,
                            parameters: { max_new_tokens: 250, return_full_text: false }
                        }),
                    }
                );

                const result = await response.json();
                
                // عرض الرد
                if (result[0] && result[0].generated_text) {
                    box.innerText = result[0].generated_text;
                } else if (result.error) {
                    box.innerText = "يا ملك، المحرك يسخن (جاري التحميل)، انتظر 10 ثواني وأعد المحاولة.";
                }

            } catch (error) {
                box.innerText = "عذراً يا إمبراطور، هناك عطل في الشبكة الخارجية. جرب مرة أخرى.";
                console.error(error);
            } finally {
                loader.style.display = "none";
            }
        }

        // دعم الإرسال بزر Enter
        document.getElementById('userQuery').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') callTallahAI();
        });
    </script>
</body>
</html>
