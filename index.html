<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>NEGM APK Builder | نظام البناء</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');
        body { background: #050505; color: white; font-family: 'Cairo', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #111; padding: 40px; border-radius: 20px; border: 1px solid #222; width: 90%; max-width: 500px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); text-align: center; }
        h1 { color: #00f2ff; font-weight: 900; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; border-radius: 10px; outline: none; }
        input:focus { border-color: #00f2ff; }
        button { width: 100%; padding: 15px; background: #00f2ff; border: none; border-radius: 10px; font-weight: 900; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { transform: scale(1.02); filter: brightness(1.1); }
        #status { margin-top: 20px; font-size: 14px; color: #888; display: none; }
        .loader { border: 3px solid #1a1a1a; border-top: 3px solid #00f2ff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .success-btn { background: #4ade80 !important; color: black !important; display: none; text-decoration: none; padding: 15px; border-radius: 10px; font-weight: 900; }
    </style>
</head>
<body>
    <div class="card">
        <h1>NEGM <span style="color:white">APK</span></h1>
        <p>حول أي موقع لتطبيق أندرويد حقيقي</p>
        <input type="url" id="appUrl" placeholder="رابط الموقع (https://...)">
        <input type="text" id="appName" placeholder="اسم التطبيق">
        <button id="mainBtn" onclick="buildApp()">إنشاء التطبيق الآن</button>
        
        <div id="status">
            <div class="loader"></div>
            <p id="statusMsg">جاري بناء التطبيق... قد يستغرق دقيقتين</p>
        </div>

        <a id="downloadLink" class="success-btn" href="#">📥 تحميل ملف APK</a>
    </div>

    <script>
        async function buildApp() {
            const url = document.getElementById('appUrl').value;
            const name = document.getElementById('appName').value;
            if(!url || !name) return alert("املا البيانات يا ملك");

            document.getElementById('mainBtn').style.display = 'none';
            document.getElementById('status').style.display = 'block';

            try {
                const res = await fetch('/generate-apk', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ url, name })
                });
                const data = await res.json();
                
                if(data.downloadUrl) {
                    document.getElementById('status').style.display = 'none';
                    const dl = document.getElementById('downloadLink');
                    dl.href = data.downloadUrl;
                    dl.style.display = 'block';
                } else {
                    alert("فشل البناء: " + data.error);
                }
            } catch (e) {
                alert("السيرفر لا يستجيب. تأكد من تشغيل الـ Backend");
            }
        }
    </script>
</body>
</html>
