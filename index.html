<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TALLAH AI</title>

<style>
body {
    margin:0;
    background:#0b0b0b;
    color:#fff;
    font-family: Arial;
    display:flex;
    flex-direction:column;
    height:100vh;
}

header {
    padding:15px;
    text-align:center;
    font-weight:bold;
    font-size:20px;
    background:#111;
    border-bottom:1px solid #222;
}

#chat {
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.msg {
    margin:10px 0;
    padding:12px;
    border-radius:12px;
    max-width:80%;
}

.user {
    background:#d4af37;
    color:#000;
    margin-left:auto;
}

.ai {
    background:#1a1a1a;
    border:1px solid #333;
}

#inputBox {
    display:flex;
    padding:10px;
    border-top:1px solid #222;
    background:#111;
}

input {
    flex:1;
    padding:12px;
    border:none;
    outline:none;
    border-radius:10px;
    background:#000;
    color:#fff;
}

button {
    margin-right:10px;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#d4af37;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<header>TALLAH AI 🤖</header>

<div id="chat"></div>

<div id="inputBox">
    <button onclick="send()">إرسال</button>
    <input id="input" placeholder="اكتب رسالتك...">
</div>

<script>
const WORKER_URL = "https://YOUR-WORKER.workers.dev"; // حط لينك الووركر هنا

function addMsg(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    document.getElementById("chat").appendChild(div);
    div.scrollIntoView();
}

async function send() {
    const input = document.getElementById("input");
    const text = input.value.trim();
    if(!text) return;

    addMsg(text, "user");
    input.value = "";

    addMsg("⏳ جاري التفكير...", "ai");

    try {
        const res = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: text })
        });

        const data = await res.json();

        let reply = data[0]?.generated_text || "مفيش رد";
        reply = reply.replace(text, "");

        document.querySelectorAll(".ai").pop().innerText = reply;

    } catch (e) {
        document.querySelectorAll(".ai").pop().innerText = "❌ حصل خطأ";
    }
}

// Enter send
document.getElementById("input").addEventListener("keypress", e => {
    if(e.key === "Enter") send();
});
</script>

</body>
</html>
