<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALLAH AI | العقل العصبي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        :root { --gold: #d4af37; --cyan: #00f2ff; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Cairo', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        
        /* تصميم الهيدر من وحي صورك */
        header { padding: 15px; text-align: center; border-bottom: 1px solid #1a1a1a; background: #000; position: relative; }
        .logo-text { font-weight: 900; font-size: 22px; color: var(--cyan); letter-spacing: 1px; }
        .server-status { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: #00ff88; font-size: 12px; display: flex; align-items: center; gap: 5px; }
        .dot { width: 8px; height: 8px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 8px #00ff88; }

        /* منطقة الدردشة الإمبراطورية */
        #chat-box { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 15px 20px; border-radius: 18px; line-height: 1.7; font-size: 15px; position: relative; }
        .user { align-self: flex-start; background: var(--cyan); color: #000; font-weight: bold; border-bottom-left-radius: 2px; }
        .ai { align-self: flex-end; background: #111; border: 1px solid #222; border-right: 4px solid var(--gold); border-bottom-right-radius: 2px; }

        /* منطقة الإدخال الاحترافية */
        .input-container { padding: 20px; background: #000; border-top: 1px solid #1a1a1a; display: flex; gap: 12px; }
        input { flex: 1; background: #111; border: 1px solid #333; padding: 15px; border-radius: 12px; color: white; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0, 242, 255, 0.1); }
        .btn { background: var(--cyan); border: none; padding: 0 20px; border-radius: 12px; cursor: pointer; color: black; font-weight: bold; }

        #thinking { color: var(--gold); font-size: 11px; text-align: center; display: none; padding: 5px; }
    </style>
</head>
<body>

<header>
    <div class="logo-text">TALLAH <span style="color:white">AI</span></div>
    <div class="server-status">متصل بالسيرفر <div class="dot"></div></div>
</header>

<div id="chat-box">
    <div class="msg ai">مرحباً بك يا إمبراطور طلة. تم تحديث الـ Token بنجاح. أنا الآن متصل بمحرك Cloudflare وجاهز لأوامرك.</div>
</div>

<div id="thinking">جاري معالجة البيانات في عقل الإمبراطورية...</div>

<div class="input-container">
    <input type="text" id="userInput" placeholder="اكتب رسالتك للملك...">
    <button class="btn" onclick="askAI()">إرسال</button>
</div>

<script>
    // بياناتك الجديدة اللي بعتها الآن
    const CF_TOKEN = "cfut_zt6wqYqCxAWReGyR0ITOdwGcU175oXdYDIoDfYiZ375adfab";
    const ACCOUNT_ID = "Vb4wU8bjlYi0iDFbnTQ4k5Ta0c8bOVUxLI3Azf2K344a167a";

    async function askAI() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        appendMsg(text, 'user');
        input.value = '';
        document.getElementById('thinking').style.display = 'block';

        try {
            const response = await fetch(
                `https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/ai/run/@cf/meta/llama-3-8b-instruct`,
                {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${CF_TOKEN}` },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: "أنت المساعد الذكي لإمبراطورية طلة للأزياء. ردودك يجب أن تكون قوية، احترافية، وتدعم البيزنس." },
                            { role: "user", content: text }
                        ]
                    })
                }
            );

            const data = await response.json();
            if (data.success) {
                appendMsg(data.result.response, 'ai');
            } else {
                appendMsg("يا ملك، الـ Token محتاج تفعيل صلاحيات Workers AI من لوحة Cloudflare.", 'ai');
            }

        } catch (e) {
            appendMsg("خطأ في الربط العصبوني.. تأكد من اتصال الإنترنت.", 'ai');
        } finally {
            document.getElementById('thinking').style.display = 'none';
        }
    }

    function appendMsg(t, type) {
        const b = document.getElementById('chat-box');
        const d = document.createElement('div');
        d.className = `msg ${type}`;
        d.innerText = t;
        b.appendChild(d);
        b.scrollTop = b.scrollHeight;
    }

    document.getElementById('userInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') askAI(); });
</script>
</body>
</html>
