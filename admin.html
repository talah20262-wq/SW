<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-6">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-2xl font-bold text-blue-400">إدارة منصة طلة</h1>
            <span class="bg-red-600 px-4 py-1 rounded text-sm">كود: 22422</span>
        </div>
        <div class="bg-slate-800 rounded-xl overflow-hidden shadow-lg">
            <table class="w-full text-right">
                <thead class="bg-slate-700">
                    <tr>
                        <th class="p-4">المتجر</th>
                        <th class="p-4">الرابط</th>
                        <th class="p-4">الحالة</th>
                        <th class="p-4">تحكم</th>
                    </tr>
                </thead>
                <tbody id="storesTable"></tbody>
            </table>
        </div>
    </div>
    <script>
        async function getStores() {
            const res = await fetch('http://localhost:3000/api/admin/stores', {
                headers: {'Authorization': '22422'}
            });
            const stores = await res.json();
            document.getElementById('storesTable').innerHTML = stores.map(s => `
                <tr class="border-b border-slate-700">
                    <td class="p-4 font-bold">${s.storeName} ${s.isVerified ? '✅' : ''}</td>
                    <td class="p-4 text-blue-300">${s.subdomain}.talla.com</td>
                    <td class="p-4">${s.plan}</td>
                    <td class="p-4"><button class="bg-blue-600 px-3 py-1 rounded text-xs">توثيق</button></td>
                </tr>
            `).join('');
        }
        window.onload = getStores;
    </script>
</body>
</html>
